# 业务路由。上游名与 Consul 里的服务名一致，由 q_upstream_sync 维护。

server {
    listen       80;
    server_name  _;

    # 接入层自己的存活探针，不打到后端
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # ---- 用户服务 ----
    # /api/user/xxx  ->  http://user-svc/xxx
    location /api/user/ {
        proxy_pass http://user-svc/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # 配合 upstream 里的 keepalive
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id      $request_id;   # nginx 1.11+，服务端日志用它做 trace
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # ---- 订单服务 ----
    location /api/order/ {
        proxy_pass http://order-svc/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id      $request_id;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location / {
        return 404 "{\"error\":\"not found\"}";
    }
}
