# qboot 接入层 nginx 配置样例
#
# 目录约定：
#   /usr/local/etc/nginx/nginx.conf          本文件
#   /usr/local/etc/nginx/conf.d/qboot.conf   路由
#   /usr/local/etc/nginx/upstream/*.conf     q_upstream_sync 生成，不要手改
#
# 启动顺序：
#   1) consul agent -dev
#   2) 启动各 qboot 服务实例（自动注册 + TTL 心跳）
#   3) q_upstream_sync 127.0.0.1:8500 /usr/local/etc/nginx/upstream \
#          --reload-cmd "nginx -s reload" user-svc order-svc
#   4) nginx

user  nobody;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /usr/local/var/log/nginx/error.log warn;
pid        /usr/local/var/run/nginx.pid;

events {
    use                 epoll;
    worker_connections  65535;
    multi_accept        on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format qboot '$remote_addr $request_method $uri $status '
                     '$request_time $upstream_response_time '
                     'upstream=$upstream_addr';
    access_log /usr/local/var/log/nginx/access.log qboot;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 10000;

    client_max_body_size        8m;
    client_body_buffer_size     128k;
    proxy_connect_timeout       3s;
    proxy_send_timeout          30s;
    proxy_read_timeout          30s;
    proxy_buffering             on;

    # 上游列表由 q_upstream_sync 维护
    include upstream/*.conf;

    # 业务路由
    include conf.d/qboot.conf;
}
