; qboot 示例服务配置
; 同名环境变量可覆盖：Q_SERVER_PORT / Q_LOG_LEVEL ...

[server]
name          = demo-svc
port          = 8081
io_threads    = 4
worker_threads = 4

[log]
dir        = /tmp/qboot-demo
level      = debug
max_bytes  = 67108864
keep_days  = 7

[db]
url  = mysql://root:pwd@127.0.0.1:3306/demo
pool = 8
