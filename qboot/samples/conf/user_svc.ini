; user-svc 配置
; 环境变量可覆盖：Q_SERVER_PORT / Q_DB_URL / Q_CONSUL_ADDR ...

[server]
name           = user-svc
port           = 8081
io_threads     = 4

[log]
dir       = logs
level     = info

[db]
; 没有真实 MySQL 时把 driver 换成 mock 就能跑：mock://u:p@127.0.0.1:0/demo
url       = mock://u:p@127.0.0.1:0/demo
pool      = 8
idle_secs = 60

[mapper]
dir       = samples/mapper

[consul]
addr      = 127.0.0.1:8500
enable    = 0
ttl       = 10
; 对外注册地址，多网卡机器一定要显式配
host      = 127.0.0.1
