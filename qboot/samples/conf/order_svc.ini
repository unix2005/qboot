; order-svc 配置
; 启动：./order_svc samples/conf/order_svc.ini

[server]
name       = order-svc
port       = 8082
io_threads = 4

[log]
dir   = logs
level = info

[db]
; mock:// 是内存假驱动，没装 MySQL 也能跑；
; 换成真库：mysql://root:123456@127.0.0.1:3306/demo
url       = mock://u:p@127.0.0.1:0/demo
pool      = 8
idle_secs = 60

[mapper]
dir = samples/mapper

[consul]
; 没装 Consul 就保持 0，跨服务调用会自动走下面的直连地址
enable = 0
addr   = 127.0.0.1:8500
host   = 127.0.0.1
ttl    = 10

[upstream]
; enable=0 时的兜底：直接写 user-svc 的地址
user_svc = 127.0.0.1:8081
